# compose.yaml — SMARTPROMARCO Gobernanza
# ==========================================
# Un único archivo. Ubuntu se mantiene limpio — todo corre en Docker.
#
# Servicios PoC (arrancan siempre):
#   docker compose up -d
#
# Servicios extendidos (Qdrant/MinIO/Grafana/Prometheus/Loki/n8n/Ollama),
# se agregan sólo cuando Fase 3+ los necesite (ver ADR-001 y el Plan Maestro):
#   docker compose --profile extended up -d

name: smartpromarco-gobernanza

networks:
  smartpromarco-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  grafana_data:
  n8n_data:
  ollama_data:

services:

  # ══════════════════════════════════════════════════════════
  # NÚCLEO POC — arrancan siempre
  # ══════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: smartpromarco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartpromarco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartpromarco}
      POSTGRES_DB: ${POSTGRES_DB:-smartpromarco}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [smartpromarco-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartpromarco}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartpromarco-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [smartpromarco-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: smartpromarco-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks: [smartpromarco-net]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: smartpromarco-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartpromarco}:${POSTGRES_PASSWORD:-smartpromarco}@postgres:5432/${POSTGRES_DB:-smartpromarco}
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./api_main.py:/app/api_main.py
    networks: [smartpromarco-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: smartpromarco-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    env_file: [.env]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
    networks: [smartpromarco-net]
    depends_on:
      api:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════
  # EXTENDIDO — perfil "extended", NO arrancan por defecto
  # Se activan cuando el Plan Maestro llegue a esa fase.
  # ══════════════════════════════════════════════════════════

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartpromarco-qdrant
    restart: unless-stopped
    profiles: [extended]
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    networks: [smartpromarco-net]

  minio:
    image: minio/minio:latest
    container_name: smartpromarco-minio
    restart: unless-stopped
    profiles: [extended]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartpromarco}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartpromarco123}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    networks: [smartpromarco-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: smartpromarco-prometheus
    restart: unless-stopped
    profiles: [extended]
    ports: ["9090:9090"]
    volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [smartpromarco-net]

  grafana:
    image: grafana/grafana:latest
    container_name: smartpromarco-grafana
    restart: unless-stopped
    profiles: [extended]
    ports: ["3001:3000"]
    volumes: [grafana_data:/var/lib/grafana]
    networks: [smartpromarco-net]

  loki:
    image: grafana/loki:latest
    container_name: smartpromarco-loki
    restart: unless-stopped
    profiles: [extended]
    ports: ["3100:3100"]
    networks: [smartpromarco-net]

  n8n:
    image: n8nio/n8n:latest
    container_name: smartpromarco-n8n
    restart: unless-stopped
    profiles: [extended]
    ports: ["5678:5678"]
    volumes: [n8n_data:/home/node/.n8n]
    networks: [smartpromarco-net]

  ollama:
    image: ollama/ollama:latest
    container_name: smartpromarco-ollama
    restart: unless-stopped
    profiles: [extended]
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    networks: [smartpromarco-net]
